version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        # npm ci rejects the packages Amplify bundles inside @aws-amplify/data-construct.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
    build:
      commands:
        # Deploys the sign-in backend (amplify/) and writes amplify_outputs.json.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        # The site loads the Cognito settings from this file at runtime (no secrets in it).
        - cp amplify_outputs.json public/amplify_outputs.json
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
